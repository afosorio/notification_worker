spring:
  application:
    name: notification-worker
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/notifications?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:notifications}
    password: ${DB_PASSWORD:notifications}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

notification:
  queue:
    poll-delay-ms: ${NOTIFICATION_QUEUE_POLL_DELAY_MS:1000}
  retry:
    max-attempts: ${MAX_ATTEMPTS:3}
    initial-delay: ${INITIAL_RETRY_DELAY:PT1S}
    max-delay: ${MAX_RETRY_DELAY:PT1M}
    scheduler-delay-ms: ${RETRY_SCHEDULER_DELAY_MS:1000}
    scheduler-batch-size: ${RETRY_SCHEDULER_BATCH_SIZE:50}
  webhook:
    url: ${WEBHOOK_URL:https://example.com/webhook}
    connect-timeout: ${WEBHOOK_CONNECT_TIMEOUT:PT2S}
    read-timeout: ${WEBHOOK_READ_TIMEOUT:PT5S}
    max-concurrent: ${MAX_CONCURRENT_WEBHOOK_REQUESTS:16}
  recovery:
    timeout: ${PENDING_RECOVERY_TIMEOUT:PT5M}
    batch-size: ${RECOVERY_BATCH_SIZE:50}
    scheduler-delay-ms: ${RECOVERY_SCHEDULER_DELAY_MS:10000}
