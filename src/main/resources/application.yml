spring:
  application:
    name: notification-worker
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/notifications?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:notifications}
    password: ${DB_PASSWORD:notifications}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

notification:
  queue:
    poll-delay-ms: ${NOTIFICATION_QUEUE_POLL_DELAY_MS:1000}
  retry:
    max-attempts: ${MAX_ATTEMPTS:3}
    initial-delay: ${INITIAL_RETRY_DELAY:PT1S}
    max-delay: ${MAX_RETRY_DELAY:PT1M}
  webhook:
    url: ${NOTIFICATION_WEBHOOK_URL:https://localhost:8443/webhook}
